name: Decode og-image
on:
  push:
    paths:
      - ".github/workflows/decode-og-image.yml"
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove staging and this workflow
        run: |
          set -euo pipefail
          git config user.name "Tishan Perera"
          git config user.email "tishanisuru@gmail.com"
          git rm -r staging-assets
          git rm .github/workflows/decode-og-image.yml
          git commit -m "Remove og-image decode staging and workflow"
          git push
