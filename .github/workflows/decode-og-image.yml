name: Decode og-image
on:
  push:
    paths:
      - "staging-assets/og-image.png.b64"
      - ".github/workflows/decode-og-image.yml"
permissions:
  contents: write
jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode og-image and commit
        run: |
          set -euo pipefail
          git config user.name "Tishan Perera"
          git config user.email "tishanisuru@gmail.com"
          mkdir -p assets
          python3 - << 'PY'
          import base64
          from pathlib import Path
          src = Path("staging-assets/og-image.png.b64")
          dest = Path("assets/og-image.png")
          dest.write_bytes(base64.b64decode(src.read_text()))
          print(dest, dest.stat().st_size)
          PY
          git add assets/og-image.png
          if git diff --cached --quiet; then
            echo "no change"
            exit 0
          fi
          git commit -m "Add decoded Open Graph image"
          git push
